<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Calculator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>

<body class="flex items-center justify-center min-h-screen bg-gray-100">
    <div class="border border-red-700 w-full max-w-md h-auto p-4 rounded-3xl bg-white shadow-lg">
        <div class="w-full h-24 flex items-center mb-4">
            <input type="text" id="input" readonly class="border w-full py-4 px-4 text-xl rounded-lg text-right">
        </div>
        <div class="bg-black rounded-3xl p-4">
            <div class="grid grid-cols-4 gap-4">
                <button onclick="clearall()"
                    class="col-span-2 border border-red-700 bg-slate-200 rounded-full py-4 text-xl">
                    <i class="fa-solid fa-a"></i><i class="fa-solid fa-c"></i>
                </button>
                <button onclick="backspace()" class="border border-red-700 bg-slate-200 rounded-full py-4 text-xl">
                    <i class="fa-solid fa-c"></i>
                </button>
                <button onclick="handleClick('/')"
                    class="border border-red-700 bg-orange-400 rounded-full py-4 text-xl">
                    <i class="fa-solid fa-divide"></i>
                </button>

                <button onclick="handleClick('7')"
                    class="border border-red-700 bg-neutral-300 rounded-full py-4 text-xl">7</button>
                <button onclick="handleClick('8')"
                    class="border border-red-700 bg-neutral-300 rounded-full py-4 text-xl">8</button>
                <button onclick="handleClick('9')"
                    class="border border-red-700 bg-neutral-300 rounded-full py-4 text-xl">9</button>
                <button onclick="handleClick('*')"
                    class="border border-red-700 bg-orange-400 rounded-full py-4 text-xl">
                    <i class="fa-solid fa-xmark"></i>
                </button>

                <button onclick="handleClick('4')"
                    class="border border-red-700 bg-neutral-300 rounded-full py-4 text-xl">4</button>
                <button onclick="handleClick('5')"
                    class="border border-red-700 bg-neutral-300 rounded-full py-4 text-xl">5</button>
                <button onclick="handleClick('6')"
                    class="border border-red-700 bg-neutral-300 rounded-full py-4 text-xl">6</button>
                <button onclick="handleClick('-')"
                    class="border border-red-700 bg-orange-400 rounded-full py-4 text-xl">
                    <i class="fa-solid fa-minus"></i>
                </button>

                <button onclick="handleClick('1')"
                    class="border border-red-700 bg-neutral-300 rounded-full py-4 text-xl">1</button>
                <button onclick="handleClick('2')"
                    class="border border-red-700 bg-neutral-300 rounded-full py-4 text-xl">2</button>
                <button onclick="handleClick('3')"
                    class="border border-red-700 bg-neutral-300 rounded-full py-4 text-xl">3</button>
                <button onclick="handleClick('+')"
                    class="border border-red-700 bg-orange-400 rounded-full py-4 text-xl">
                    <i class="fa-solid fa-plus"></i>
                </button>

                <button onclick="handleClick('0')"
                    class="col-span-2 border border-red-700 bg-neutral-300 rounded-full py-4 text-xl">0</button>
                <button onclick="handleClick('.')"
                    class="border border-red-700 bg-neutral-300 rounded-full py-4 text-xl">.</button>
                <button onclick="handleSolve()" class="border border-red-700 bg-orange-400 rounded-full py-4 text-xl">
                    <i class="fa-solid fa-equals"></i>
                </button>
            </div>
        </div>
    </div>

    <script>
        const handleClick = (val) => {
            if (!isNaN(parseInt(val))) {
                document.getElementById("input").value += val;
            } else {
                let inpt = document.getElementById("input").value;
                let num = inpt.slice(-1);
                if (!isNaN(parseInt(num))) {
                    document.getElementById("input").value += val;
                } else {
                    alert("Invalid Input");
                }
            }
        };

        const handleSolve = () => {
            let input = document.getElementById("input").value;
            if (input.length > 0) {
                let ans = eval(input);
                document.getElementById("input").value = ans;
            } else {
                alert("Input the first number");
            }
        };

        const clearall = () => {
            document.getElementById("input").value = "";
        };

        const backspace = () => {
            let inpt = document.getElementById("input").value;
            document.getElementById("input").value = inpt.slice(0, -1);
        };
    </script>
</body>

</html>
